name: CI Pipeline

on:
  push:
    branches:
      - develop
      - main
      - 'feature/**'
  pull_request:
    branches:
      - develop
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      
      - name: Install root dependencies
        run: npm ci
      
      - name: Install all microservices dependencies
        run: |
          cd player-service && npm ci && cd ..
          cd achievement-service && npm ci && cd ..
          cd reward-service && npm ci && cd ..
      
      - name: Run linter on all services
        run: |
          cd player-service && npm run lint && cd ..
          cd achievement-service && npm run lint && cd ..
          cd reward-service && npm run lint && cd ..
        continue-on-error: true
      
      - name: Build all services
        run: |
          cd player-service && npm run build && cd ..
          cd achievement-service && npm run build && cd ..
          cd reward-service && npm run build && cd ..
      
      - name: Run unit tests on all services
        run: |
          cd player-service && npm test && cd ..
          cd achievement-service && npm test && cd ..
          cd reward-service && npm test && cd ..
      
      - name: Generate test coverage
        run: |
          cd player-service && npm run test:cov && cd ..
          cd achievement-service && npm run test:cov && cd ..
          cd reward-service && npm run test:cov && cd ..
        continue-on-error: true
